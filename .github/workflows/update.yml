name: Update fund data

on:
  schedule:
    - cron: "40 1 * * *"     # every day 07:10 IST
  push:
    paths:
      - "mf-dashboard/holdings.xlsx"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mf-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mf-dashboard/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch NAVs, holdings and factsheet numbers
        run: python scripts/update.py
      - name: Save data to the repo
        run: |
          git config user.name "mf-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
